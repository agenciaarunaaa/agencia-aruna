<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formulário · Aruna para tatuador</title>
<link rel="icon" href="assets/simbolo.svg">
<link rel="stylesheet" href="estilo.css?v=20261017">
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;max-width:760px;width:100%;margin:0 auto}
.voltar{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;visibility:hidden}
.barra{height:3px;background:var(--faint);max-width:760px;width:calc(100% - 40px);margin:0 auto;border-radius:3px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--grad);transition:width .35s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 20px 60px}
.tela{max-width:640px;width:100%;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tela .kicker{display:block;margin-bottom:14px}
.tela h1{font-size:clamp(28px,4.6vw,42px);margin-bottom:14px}
.tela .sub{color:var(--muted);font-size:17px;margin-bottom:26px}
.opcoes{display:grid;gap:10px;margin-bottom:22px}
.op{display:flex;align-items:center;gap:14px;text-align:left;background:var(--void-2);border:1px solid rgba(244,239,232,.12);border-radius:14px;padding:16px 18px;color:var(--cream);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.op:hover{border-color:rgba(255,107,53,.5)}
.op .l{flex:0 0 28px;height:28px;border-radius:8px;border:1px solid rgba(244,239,232,.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.op.on{border-color:var(--orange);background:rgba(255,107,53,.1)}
.op.on .l{background:var(--grad);color:#1a0d08;border-color:transparent}
.campo{width:100%;background:transparent;border:0;border-bottom:2px solid rgba(244,239,232,.2);color:var(--cream);font:inherit;font-size:24px;padding:10px 2px;margin-bottom:26px;outline:none}
.campo:focus{border-color:var(--orange)}
.campo::placeholder{color:rgba(244,239,232,.25)}
.erro{color:var(--coral);font-size:14px;margin:-16px 0 18px;min-height:20px}
.dica{font-size:13px;color:var(--muted);margin-left:14px}
.info{background:linear-gradient(160deg,var(--void-2),var(--void-3));border:1px solid var(--faint);border-radius:var(--r);padding:22px;margin-bottom:24px}
.info .linha{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--faint)}
.info .linha:last-child{border:0}
.info .linha b{font-family:var(--display);font-size:22px;white-space:nowrap;text-align:right}
.info .linha b small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.info .linha b em{font-style:normal}
.info .linha span{color:var(--muted)}
.info .tot b{font-size:28px}
.nums3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.nums3 div{background:var(--void-2);border:1px solid var(--faint);border-radius:14px;padding:14px}
.nums3 b{font-family:var(--display);font-size:26px;display:block}
.nums3 small{color:var(--muted);font-size:13px;line-height:1.3;display:block}
.nums3 .quem{color:var(--amber);margin-bottom:6px}
.nums3 .extra{margin-top:8px}
.termo{margin:-8px 0 24px}
.termo i{display:block;height:8px;border-radius:8px;background:linear-gradient(90deg,#ff4d3d,var(--amber),#4f8fe8)}
.termo div{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.diag{display:grid;gap:12px;margin-bottom:26px}
.diag .it{background:var(--void-2);border:1px solid var(--faint);border-left:3px solid var(--orange);border-radius:12px;padding:16px 18px}
.diag .it b{display:block;font-family:var(--display);font-size:18px;margin-bottom:4px}
.diag .it p{color:var(--muted);font-size:15.5px}
.fase{display:inline-block;border:1px solid rgba(245,166,35,.4);color:var(--amber);border-radius:999px;padding:6px 14px;font-size:13px;margin-bottom:18px}
.igbox{background:var(--void-2);border:1px solid var(--faint);border-radius:14px;padding:16px 18px;margin:-8px 0 20px}
.igbox .pf{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.igbox .pf img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--void-3)}
.igbox .pf b{display:block;font-size:17px}
.igbox .pf small{color:var(--muted);font-size:14px}
.igbox p{color:var(--muted);font-size:15px;margin-bottom:14px}
.igbox .acoes{display:flex;gap:10px;flex-wrap:wrap}
.igbox .acoes .btn{margin:0}
.btn.sec{background:transparent;color:var(--cream);border:1px solid rgba(244,239,232,.25);box-shadow:none}
.btn.wa{background:#25D366;color:#06210f;box-shadow:0 10px 40px -12px rgba(37,211,102,.55)}
@media (max-width:600px){.nums3{grid-template-columns:1fr !important}.campo{font-size:20px}}
</style>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

<script>
var WA = '5585986187522';
var R = { utm: Object.fromEntries(new URLSearchParams(location.search)) };
var historico = [];

// A régua de lead qualificado do worker (form-leads.js, FORM_CONFIGS) valida essas opções pelo texto exato:
// mudar um texto aqui exige mudar o worker no mesmo deploy, e o worker sobe antes da página.
var VERBA_QUALIFICA = ['Tenho os R$ 1.800', 'Entre R$ 2.000 e R$ 3.000', 'Acima de R$ 3.000'];
// Quem fatura até R$ 6 mil recebe as orientações, mesmo com a verba.
var FATURAMENTO_CORTA = ['Ainda não tenho renda fixa com tattoo','Até R$ 3 mil','Entre R$ 3 mil e R$ 6 mil'];
function qualifica(v){ return VERBA_QUALIFICA.indexOf(v)>=0 && FATURAMENTO_CORTA.indexOf(R.faturamento)<0; }

var TELAS = {
  inicio: {tipo:'info', kicker:'Formulário · poucos minutos',
    titulo:'Antes de tudo: são perguntas rápidas, e cada resposta conta.',
    sub:'Preencher não garante vaga. Atendemos poucos tatuadores por vez, e o formulário existe para ver se faz sentido para os dois lados. Quem ainda não estiver no momento recebe, na hora, orientações para o perfil com base nas respostas.',
    botao:'Começar', prox:'dor'},

  dor: {tipo:'multi', chave:'dor', kicker:'1 de 12',
    titulo:'O que mais trava sua agenda hoje?', sub:'Pode marcar mais de uma.',
    opcoes:['Muita gente pergunta o preço e some','Dependo de indicação','Posto e não vira cliente','Agenda com buraco na semana','Cliente só quer desconto','Não sei o que postar'],
    prox:'nome'},

  nome: {tipo:'texto', chave:'nome', kicker:'2 de 12', titulo:'Qual é o seu nome?', ph:'Seu primeiro nome', prox:'whatsapp',
    valida:function(v){ return v.trim().length>1 || 'Escreve seu nome para a gente te chamar certo.'; }},

  whatsapp: {tipo:'texto', chave:'whatsapp', kicker:'3 de 12', titulo:function(){ return 'Prazer, '+R.nome+'. Qual o seu WhatsApp?'; },
    sub:'É por ele que vai o próximo passo.', ph:'(85) 99999-9999', inputmode:'tel', prox:function(){ return R._reenviar || 'instagram'; },
    mascara:function(v){ var d=v.replace(/\D/g,'').slice(0,11); if(d.length>6) return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7); if(d.length>2) return '('+d.slice(0,2)+') '+d.slice(2); return d; },
    valida:function(v){ return v.replace(/\D/g,'').length>=10 || 'Confere o número com DDD.'; }},

  instagram: {tipo:'texto', chave:'instagram', kicker:'4 de 12', titulo:'E o @ do Instagram? Seu ou do estúdio.', sub:'É nele que a gente olha antes de responder.', ph:'@seuperfil', prox:'prova',
    valida:function(v){ return !!normIG(v) || 'Isso não parece um @ do Instagram. Só letras, números, ponto e _ (ex: @seuestudio).'; },
    conferir:conferirInstagram},

  prova: {tipo:'info', kicker:'Enquanto isso',
    titulo:function(){ return R.nome+', olha o que só o anúncio já trouxe para quem está com a gente.'; },
    sub:'Tattoo fechada que começou num anúncio, antes do atendente de IA entrar no método:',
    extra:'<div class="nums3" style="grid-template-columns:1fr 1fr">'+
      '<div><small class="quem">Gabriel · @gtottoo · Águas Claras, DF</small><b>R$ 4.300</b><small>em tattoos fechadas que vieram dos anúncios, desde setembro</small><small class="extra">A primeira foi de R$ 800, com R$ 191 de anúncio até ela. E 9 em cada 10 conversas vieram de quem já tinha visto o trabalho dele.</small><p class="veredito" style="font-size:16px;padding:10px 12px;margin:12px 0 0">Cada uma dessas tattoos começou num anúncio.</p></div>'+
      '<div><small class="quem">Will · Barra do Garças, MT</small><b>R$&nbsp;7&nbsp;mil+</b><small>em 2 tattoos fechadas na primeira semana de anúncio</small><small class="extra">A primeira passou de R$&nbsp;5&nbsp;mil, com mais de R$&nbsp;1&nbsp;mil de sinal, e saiu com menos de R$&nbsp;50 de anúncio até ela. Na semana foram cerca de 40 conversas no WhatsApp.</small><p class="veredito" style="font-size:16px;padding:10px 12px;margin:12px 0 0">Menos de R$&nbsp;150 de anúncio virou mais de R$&nbsp;7&nbsp;mil em tattoo.</p></div>'+
      '</div><p class="muted" style="font-size:14px;margin-bottom:24px">Fechamentos informados pelos próprios clientes. Investimento em anúncio conferido na conta de anúncio de cada um. Não é média nem promessa: cada cidade, estilo e perfil responde diferente, e é por isso que a gente mede toda semana.</p>',
    botao:'Continuar', prox:'equipe'},

  equipe: {tipo:'uma', chave:'equipe', kicker:'5 de 12', titulo:function(){ return R.nome+', você trabalha como?'; },
    opcoes:['Sozinho(a)','Estúdio com 2 ou 3 tatuadores','Estúdio com 4 ou mais'], prox:'faturamento'},

  faturamento: {tipo:'uma', chave:'faturamento', kicker:'6 de 12', titulo:'Em média, quanto você fatura por mês com tattoo?', sub:'Se você tem equipe, conte o estúdio inteiro. Ninguém além de nós vê.',
    opcoes:['Ainda não tenho renda fixa com tattoo','Até R$ 3 mil','Entre R$ 3 mil e R$ 6 mil','Entre R$ 6 mil e R$ 10 mil','Entre R$ 10 mil e R$ 25 mil','Acima de R$ 25 mil'], prox:'ticket'},

  ticket: {tipo:'uma', chave:'ticket', kicker:'7 de 12', titulo:'Quanto custa uma sessão, em média?',
    opcoes:['Até R$ 500','Entre R$ 500 e R$ 1.000','Entre R$ 1.000 e R$ 2.000','Acima de R$ 2.000'], prox:'trafego'},

  trafego: {tipo:'uma', chave:'trafego', kicker:'8 de 12', titulo:'Já anunciou antes?',
    opcoes:['Nunca','Só impulsionei pelo Instagram','Já tive gestor ou agência','Anuncio hoje'], prox:'atende_tempo'},

  atende_tempo: {tipo:'uma', chave:'atende_tempo', kicker:'9 de 12', titulo:'No seu horário de atendimento, quanto tempo você costuma levar para responder uma mensagem nova?',
    sub:'Quanto mais a resposta demora, mais o cliente esfria. Pode ser sincero: fica só com a gente.',
    opcoes:['Até 5 minutos','Mais de 5 até 30 minutos','Mais de 30 até 120 minutos','Mais de 120 minutos'],
    depois:'<div class="termo"><i></i><div><span>cliente quente</span><span>cliente frio</span></div></div>',
    prox:'cobra_sinal'},

  cobra_sinal: {tipo:'uma', chave:'cobra_sinal', kicker:'10 de 12', titulo:'Você cobra sinal para agendar?',
    opcoes:['Sim, sempre','Às vezes','Não cobro'], prox:'investimentos'},

  investimentos: {tipo:'info', kicker:'Transparência',
    titulo:'Existem dois investimentos, e você precisa saber dos dois antes.',
    extra:'<div class="info"><div class="linha"><span>Nosso trabalho: a demanda (campanha e criativo), o Sórisca (nosso atendente de IA) no seu WhatsApp e o placar semanal</span><b>R$ 900</b></div><div class="linha"><span>Anúncio no Meta Ads, pago direto no seu cartão. A Meta soma cerca de R$ 125 de impostos no mês</span><b>R$ 30 por dia<small>cerca de R$ 900 no mês</small></b></div><div class="linha tot"><span>Total por mês, sem fidelidade, mais os impostos da Meta</span><b><small>cerca de</small><em class="grad-txt">R$ 1.800</em></b></div></div><p class="muted" style="margin-bottom:10px">O Sórisca sozinho custa R$ 197/mês. No método, ele já vem incluso.</p><p class="muted" style="margin-bottom:10px">Exemplo de faturamento bruto: três sessões de R$ 1.000 somam R$ 3.000.</p><p class="muted" style="margin-bottom:24px">E não precisa sair de uma vez: a gestão pode ser paga a cada 15 dias (R$ 450) e o anúncio vai para a fatura do seu cartão de crédito.</p>',
    botao:'Ok, entendido', prox:'verba'},

  verba: {tipo:'uma', chave:'investimento', kicker:'11 de 12', titulo:'Hoje, você consegue investir os R$ 1.800 por mês?', sub:'Contando com a gestão quinzenal e o anúncio no cartão. Os impostos da Meta vêm à parte, na fatura.',
    opcoes:VERBA_QUALIFICA.concat(['Ainda não tenho esse valor']),
    prox:function(v){ return qualifica(v) ? 'decisor' : 'frequencia'; }},

  // ramo qualificado
  decisor: {tipo:'uma', chave:'decisor', kicker:'12 de 12', titulo:'A decisão de investir é só sua?',
    opcoes:['Sim, decido sozinho(a)','Divido com sócio(a) ou parceiro(a)'], prox:'fim_qualificado'},
  // "Quando você quer começar?" saiu em 17/10/2026 (Lucas: "acho sem sentido, pode remover ela").

  // ramo de orientações: uma pergunta a mais; o tamanho do perfil vem da conferência do Instagram (passo 4)
  frequencia: {tipo:'uma', chave:'frequencia', kicker:'Última pergunta', titulo:'Sem problema. Com que frequência você posta no feed?', sub:'É para as orientações saírem do tamanho certo para você.',
    opcoes:['Quase todo dia','2 ou 3 vezes por semana','1 vez por semana ou menos','Fico semanas sem postar'], prox:'fim_diagnostico'}
};

var palco = document.getElementById('palco');
function val(x){ return typeof x==='function' ? x() : x; }

// id_submissao: o mesmo em todo reenvio do mesmo preenchimento (o worker usa para não gravar duas vezes).
// Fica no sessionStorage e só é trocado depois de um envio confirmado.
var CHAVE_ID = 'aruna_tatuador_id_submissao';
function novoId(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){ var r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
}
function idSubmissao(){
  if(R.id_submissao) return R.id_submissao;
  var id = null; try{ id = sessionStorage.getItem(CHAVE_ID); }catch(e){}
  if(!id){ id = novoId(); try{ sessionStorage.setItem(CHAVE_ID, id); }catch(e){} }
  return R.id_submissao = id;
}

var etapasVistas = {};
function ir(id, voltando){
  if(!voltando && historico[historico.length-1]!==id) historico.push(id);
  // Uma vez por tela: mostra no pixel em que pergunta a pessoa desiste.
  if(!voltando && !etapasVistas[id]){ etapasVistas[id] = 1; if(window.fbq) fbq('trackCustom','FormStep',{form:'trafego-pago-v2',etapa:id}); }
  var t = TELAS[id]; if(id.indexOf('fim_')===0) return fim(id);
  if(t.tipo!=='info') idSubmissao();
  document.getElementById('voltar').style.visibility = historico.length>1 ? 'visible' : 'hidden';
  // Barra pelo número do kicker ("N de 12"); tela informativa mantém a da pergunta anterior.
  var n = String(t.kicker).match(/^(\d+) de (\d+)/), barra = document.getElementById('progresso');
  if(n) barra.style.width = ((n[1]-1)/n[2]*100)+'%'; else if(id==='inicio') barra.style.width = '0%';

  var h = '<div class="tela"><span class="kicker">'+t.kicker+'</span><h1>'+val(t.titulo)+'</h1>'+(t.sub?'<p class="sub">'+val(t.sub)+'</p>':'')+(t.extra||'');
  if(t.tipo==='info') h += '<button class="btn" id="ok">'+t.botao+'</button>';
  if(t.tipo==='texto') h += '<input class="campo" id="campo" autocomplete="off" placeholder="'+t.ph+'"'+(t.inputmode?' inputmode="'+t.inputmode+'"':'')+(t.conferir?' autocapitalize="none" autocorrect="off" spellcheck="false"':'')+' value="'+(R[t.chave]||'')+'"><div class="erro" id="erro"></div><button class="btn" id="ok">OK</button><span class="dica">ou aperte Enter</span>';
  if(t.tipo==='uma'||t.tipo==='multi'){
    h += '<div class="opcoes">'+t.opcoes.map(function(o,i){
      var on = t.tipo==='multi' ? (R[t.chave]||[]).indexOf(o)>=0 : R[t.chave]===o;
      return '<button class="op'+(on?' on':'')+'" data-v="'+o+'"><span class="l">'+String.fromCharCode(65+i)+'</span>'+o+'</button>'; }).join('')+'</div>'+(t.depois||'');
    if(t.tipo==='multi') h += '<div class="erro" id="erro"></div><button class="btn" id="ok">OK</button>';
  }
  palco.innerHTML = h + '</div>';

  var ok = document.getElementById('ok');
  var proximo = function(v){ var p = typeof t.prox==='function' ? t.prox(v) : t.prox; ir(p); };

  if(t.tipo==='info') ok.onclick = function(){ proximo(); };
  if(t.tipo==='texto'){
    var c = document.getElementById('campo'); c.focus();
    if(t.mascara) c.oninput = function(){ c.value = t.mascara(c.value); };
    var enviar = function(){ var r = t.valida(c.value); if(r!==true){ document.getElementById('erro').textContent=r; return; }
      if(t.conferir) return t.conferir(c, ok, proximo);
      R[t.chave]=c.value.trim(); proximo(); };
    ok.onclick = enviar; c.onkeydown = function(e){ if(e.key==='Enter') enviar(); };
  }
  if(t.tipo==='uma') palco.querySelectorAll('.op').forEach(function(b){ b.onclick=function(){
    palco.querySelectorAll('.op').forEach(function(x){x.classList.remove('on')}); b.classList.add('on'); R[t.chave]=b.dataset.v;
    setTimeout(function(){ proximo(b.dataset.v); }, 220); }; });
  if(t.tipo==='multi'){
    palco.querySelectorAll('.op').forEach(function(b){ b.onclick=function(){ b.classList.toggle('on'); }; });
    ok.onclick = function(){ var s=[].map.call(palco.querySelectorAll('.op.on'),function(x){return x.dataset.v}); if(!s.length){ document.getElementById('erro').textContent='Marca pelo menos uma.'; return; } R[t.chave]=s; proximo(); };
  }
}

document.getElementById('voltar').onclick = function(){ if(historico.length>1){ historico.pop(); ir(historico[historico.length-1], true); } };
document.addEventListener('keydown', function(e){
  var ops = palco.querySelectorAll('.op'); var i = e.key.toUpperCase().charCodeAt(0)-65;
  if(ops.length && e.key.length===1 && i>=0 && i<ops.length && document.activeElement.tagName!=='INPUT') ops[i].click();
});

// Conferência do @ (26/09/2026). O worker consulta a Meta, que só enxerga perfil comercial ou
// de criador: perfil pessoal e perfil inexistente voltam iguais. Desde 17/10/2026 (Lucas: "não
// permita que o cliente passe sem mencionar o perfil dele corretamente") "não achado" barra: pede
// para corrigir o @ ou trocar para conta profissional, que é a que pode anunciar. Só a falha
// técnica da consulta deixa seguir, e o grupo Holding recebe como ficou em ig_verificado.
var IG_API = 'https://aruna-atendimento.yanna-barbara.workers.dev/api/ig-perfil';
function normIG(v){
  var s = String(v||'').trim().toLowerCase(), m = s.match(/instagram\.com\/([^\/?#\s]+)/);
  if(m) s = m[1];
  s = s.replace(/^@+/,'').replace(/\s+/g,'').replace(/\/+$/,'');
  if(!s || s.length>30 || !/^[a-z0-9._]+$/.test(s)) return null;
  if(s.charAt(0)==='.' || s.slice(-1)==='.' || s.indexOf('..')>=0) return null;
  return s;
}
function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }
function conferirInstagram(c, ok, proximo){
  var u = normIG(c.value), erro = document.getElementById('erro');
  var velho = document.getElementById('igbox'); if(velho) velho.remove();
  erro.textContent = ''; c.value = '@'+u;
  var seguir = function(status, seguidores){ R.instagram = '@'+u; R.ig_verificado = status; R.ig_seguidores = seguidores!=null ? Number(seguidores) : null; proximo(); };
  var caixa = function(html){
    var d = document.createElement('div'); d.className='igbox'; d.id='igbox'; d.innerHTML = html;
    ok.style.display='none'; ok.nextElementSibling.style.display='none';
    erro.parentNode.insertBefore(d, ok); return d;
  };
  // Fecha a caixa sem selecionar o texto: com select() cada tecla apagava o que ja estava escrito.
  var fechar = function(){ var b=document.getElementById('igbox'); if(b) b.remove(); ok.style.display=''; ok.nextElementSibling.style.display=''; };
  var corrigir = function(){ fechar(); c.focus(); var n=c.value.length; c.setSelectionRange(n,n); };
  c.oninput = fechar;
  ok.disabled = true; ok.textContent = 'Conferindo...';
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 6000);
  fetch(IG_API+'?u='+encodeURIComponent(u), ctl ? {signal:ctl.signal} : {})
    .then(function(r){ return r.json(); })
    .then(function(d){
      clearTimeout(timer); ok.disabled=false; ok.textContent='OK';
      if(!d || !d.ok || d.indeterminado) return seguir('não conferido (consulta falhou)');
      if(d.encontrado){
        var seg = d.seguidores!=null ? Number(d.seguidores).toLocaleString('pt-BR')+' seguidores' : '';
        var b = caixa('<div class="pf">'+(d.foto?'<img src="'+esc(d.foto)+'" alt="" referrerpolicy="no-referrer">':'')+'<div><b>@'+esc(d.username||u)+'</b><small>'+esc(d.nome||'')+(d.nome&&seg?' · ':'')+seg+'</small></div></div>'+
          '<p>É este o seu perfil?</p><div class="acoes"><button class="btn" id="igsim">Sim, é esse</button><button class="btn sec" id="ignao">Não, corrigir</button></div>');
        b.querySelector('#igsim').onclick = function(){ seguir('sim'+(seg?', '+seg:''), d.seguidores); };
        b.querySelector('#ignao').onclick = corrigir;
      } else {
        var b2 = caixa('<p>Não achamos <b>@'+esc(u)+'</b> no Instagram como conta profissional. Confere se está escrito certo.</p>'+
          '<p>Se estiver certo, seu perfil ainda é pessoal. Para anunciar no Instagram ele precisa ser profissional, e a troca é grátis: no app, abra o menu do seu perfil, toque em <b>Tipo de conta e ferramentas</b> e depois em <b>Mudar para conta profissional</b>.</p>'+
          '<div class="acoes"><button class="btn" id="ignao">Corrigir o @</button><button class="btn sec" id="igdenovo">Já mudei, conferir de novo</button></div>');
        b2.querySelector('#ignao').onclick = corrigir;
        b2.querySelector('#igdenovo').onclick = function(){ fechar(); conferirInstagram(c, ok, proximo); };
      }
    })
    .catch(function(){ clearTimeout(timer); ok.disabled=false; ok.textContent='OK'; seguir('não conferido (consulta falhou)'); });
}

// Orientações automáticas do momento (quem não passou no corte). Regras simples, sem oferta de gestão.
var DICAS = {
  'Muita gente pergunta o preço e some': ['Deixe um "a partir de" visível', 'Um destaque "Valores" com o preço de partida e o que está incluso responde a dúvida antes de a pessoa te chamar. Você gasta menos tempo repetindo orçamento.'],
  'Dependo de indicação': ['Guarde a indicação no perfil', 'No fim de cada sessão, grave 15 segundos do cliente falando da experiência e salve num destaque. A indicação passa a vender mesmo quando ninguém lembra de você.'],
  'Posto e não vira cliente': ['Diga como marcar', 'A cada três posts, um precisa mostrar o caminho: agenda aberta, valor de partida e como chamar. Post bonito sem chamada vira curtida.'],
  'Agenda com buraco na semana': ['Anuncie as vagas da semana', 'Toda segunda, um story com as datas livres e quantas vagas sobraram. Vaga com prazo mexe mais do que "agenda aberta" o mês inteiro.'],
  'Cliente só quer desconto': ['Mande valor com contexto', 'Nunca o preço seco no direct. Junto do valor, mande uma peça parecida que você fez e o que está incluso (desenho exclusivo, retoque). Preço sem contexto vira comparação.'],
  'Não sei o que postar': ['Três tipos em rodízio', 'Tattoo cicatrizada (prova), processo em vídeo (confiança) e cliente falando (desejo). Repetir esses três já resolve o mês de conteúdo.']
};
function diagnostico(){
  var fase, frase, itens = [];
  var semRenda = R.faturamento==='Ainda não tenho renda fixa com tattoo' || R.ticket==='Até R$ 500';
  var pequeno = R.ig_seguidores!=null && R.ig_seguidores < 1000;
  if(semRenda){ fase='Momento: construir a vitrine'; frase='Pelas suas respostas, o primeiro passo é o perfil convencer sozinho quem já chega até ele. Anúncio leva gente nova ao perfil, e vale a pena quando o perfil já mostra seu trabalho, sua cidade e como pedir orçamento.'; }
  else if(pequeno){ fase='Momento: transformar perfil em agenda'; frase='Pelas suas respostas, o próximo degrau é fazer o perfil trabalhar com o público que você já tem, antes de comprar público novo.'; }
  else { fase='Momento: preparar o perfil para o anúncio'; frase='Antes de investir, confira se o perfil mostra seu trabalho, sua cidade e como pedir orçamento. Com isso no lugar, um anúncio pequeno passa a ter onde cair.'; }
  (R.dor||[]).slice(0,2).forEach(function(d){ if(DICAS[d]) itens.push(DICAS[d]); });
  if(R.atende_tempo==='Mais de 30 até 120 minutos' || R.atende_tempo==='Mais de 120 minutos')
    itens.push(['Responda antes de o cliente esfriar', 'Defina uma rotina de checagem das mensagens durante seu horário de atendimento e deixe respostas rápidas salvas para as dúvidas frequentes, com o valor de partida e o próximo passo. Escolha intervalos que consiga cumprir.']);
  if(R.cobra_sinal==='Às vezes' || R.cobra_sinal==='Não cobro')
    itens.push(['Cobre sinal para segurar a data', 'Peça um sinal na hora de marcar e diga que ele abate do valor final. A data fica garantida para os dois lados.']);
  if(R.frequencia==='1 vez por semana ou menos' || R.frequencia==='Fico semanas sem postar')
    itens.push(['Constância antes de volume', 'Três posts por semana, no mesmo dia e horário, pesam mais que uma semana cheia seguida de silêncio. Deixe três peças prontas no domingo.']);
  if(pequeno) itens.push(['Seguidor local vale mais', 'Com menos de 1.000 seguidores, marque a cidade em todo post e siga estúdios e perfis de tattoo da sua região. É o público que te encontra primeiro.']);
  return {fase:fase, frase:frase, itens:itens.slice(0,4)};
}

function linkWA(txt){ return 'https://wa.me/'+WA+'?text='+encodeURIComponent(txt); }

function fim(id){
  document.getElementById('progresso').style.width='100%';
  document.getElementById('voltar').style.visibility='hidden';
  R.ramo = id==='fim_qualificado' ? 'qualificado' : 'diagnostico_automatico';
  palco.innerHTML = '<div class="tela"><span class="kicker">Enviando</span><h1>Um segundo, '+R.nome+'.</h1></div>';
  gravar().then(function(d){
    // Número recusado pelo worker: volta para o campo do WhatsApp com o motivo, sem perder o resto.
    if(d.erro==='telefone_invalido' || d.erro==='whatsapp_inexistente'){
      R._reenviar = id;
      historico = historico.slice(0, historico.indexOf('whatsapp')+1);
      ir('whatsapp', true);
      document.getElementById('erro').textContent = d.erro==='whatsapp_inexistente'
        ? 'Esse número não tem WhatsApp. Confere o DDD e o 9 na frente.'
        : 'Esse número não parece válido. Confere o DDD.';
      return;
    }
    // Só conta como recebido o que o worker confirma que guardou (banco ou fila). O resto mostra a falha
    // e deixa reenviar com o mesmo id_submissao, sem perder as respostas.
    if(!(d.ok===true && d.ref && (d.persistido==='banco' || d.persistido==='fila'))) return falhaEnvio(id, d);
    R._reenviar = null;
    try{ sessionStorage.removeItem(CHAVE_ID); }catch(e){}
    mostrarFim(id, d.ref);
  });
}

function falhaEnvio(id, d){
  var sub = d.erro==='muitas_tentativas'
    ? 'Atingimos o limite de envios desta conexão. Suas respostas continuam aqui: tenta de novo mais tarde.'
    : 'Suas respostas continuam aqui. Confere a internet e tenta de novo.';
  palco.innerHTML = '<div class="tela"><span class="kicker">Não foi</span><h1>'+R.nome+', não conseguimos confirmar o envio.</h1>'+
    '<p class="sub">'+sub+'</p><button class="btn" id="denovo">Tentar de novo</button></div>';
  document.getElementById('denovo').onclick = function(){ fim(id); };
}

function mostrarFim(id, ref){
  var h;
  if(id==='fim_qualificado'){
    // Sem a pergunta "quando quer começar" (17/10/2026), todo qualificado recebe a versão de quem quer começar já.
    var quente = true;
    // As respostas ja chegam no grupo Holding pela automacao: a mensagem do lead fica curta.
    // O [REF:] precisa ficar, e o que liga a conversa ao anuncio.
    var msg = 'Oi, Lucas! Respondi as perguntas lá no site e quero o diagnóstico do meu perfil.'+(ref ? '\n\n[REF:'+ref+']' : '');
    h = '<div class="tela"><span class="kicker">Respostas recebidas</span>'+
      '<h1>'+R.nome+', você passou na primeira triagem.</h1>'+
      '<p class="sub">'+(quente
        ? 'O próximo passo é continuar no WhatsApp do Lucas. Por lá, vocês combinam o diagnóstico por escrito: ele analisa seus números, seu feed e sua cidade e mostra o que faria primeiro.'
        : 'Você pode continuar a conversa no WhatsApp do Lucas e combinar por lá o diagnóstico do seu perfil, feito por escrito.')+'</p>'+
      '<a class="btn wa" href="'+linkWA(msg)+'" target="_blank" rel="noopener">'+(quente?'Receber meu diagnóstico no WhatsApp':'Continuar no WhatsApp')+'</a>'+
      '<p class="cta-note">A mensagem já vai escrita. É só enviar.</p></div>';
  } else {
    var d = diagnostico();
    h = '<div class="tela"><span class="kicker">Orientações para o seu momento</span>'+
      '<h1>'+R.nome+', aqui está o que a gente faria no seu lugar.</h1>'+
      '<span class="fase">'+d.fase+'</span><p class="sub">'+d.frase+'</p>'+
      '<p class="muted" style="font-size:14px;margin:-12px 0 22px">Geradas a partir das suas respostas, sem análise individual do seu Instagram.</p>'+
      '<div class="diag">'+d.itens.map(function(x){ return '<div class="it"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>'; }).join('')+'</div>'+
      '<p class="muted" style="font-size:15px;margin-bottom:6px">Hoje a gestão atende quem já vive de tattoo: faturamento a partir de R$ 6 mil por mês e os R$ 1.800 mensais disponíveis. Até lá, estas orientações são o primeiro passo.</p>'+
      // sem botao de WhatsApp: quem ficou fora do corte recebe as orientacoes aqui e nao e atendido
      '<p class="cta-note">Quando o momento mudar, o formulário continua aberto.</p></div>';
  }
  palco.innerHTML = h;
}

// Envio para o worker aruna-atendimento: grava no banco e no CRM, manda Lead (e QualifiedLead, pela
// verba) via CAPI com event_id form-lead-<ref>. O fbq abaixo usa o mesmo eventID para a Meta deduplicar.
// oferta e id_submissao só são lidos pelo worker novo: ele precisa estar no ar antes desta página.
var API = 'https://aruna-atendimento.yanna-barbara.workers.dev/api/form-lead';
var PIXEL = '805389752641637';
var OFERTA = 'sinal-pago-2026-10';
var INICIO = Date.now();
var qs = new URLSearchParams(location.search);
if(window.fbq) fbq('trackCustom','FormView',{form:'trafego-pago-v2'});

function cookie(n){ var m = document.cookie.match('(?:^|; )'+n+'=([^;]*)'); return m ? decodeURIComponent(m[1]) : null; }
function tracking(){ return {url:location.href, fbclid:qs.get('fbclid'), fbp:cookie('_fbp'), fbc:cookie('_fbc'),
  utm_source:qs.get('utm_source'), utm_medium:qs.get('utm_medium'), utm_campaign:qs.get('utm_campaign'), utm_content:qs.get('utm_content'), utm_term:qs.get('utm_term')}; }
function respostas(){
  var r = {};
  ['nome','whatsapp','instagram','ig_verificado','equipe','faturamento','ticket','trafego','atende_tempo','cobra_sinal','investimento','decisor','frequencia']
    .forEach(function(k){ if(R[k]) r[k] = R[k]; });
  if(R.dor && R.dor.length) r.dor = R.dor.join(', ');
  return r;
}
function post(slug){
  return fetch(API, {method:'POST', headers:{'content-type':'application/json'},
    body:JSON.stringify({slug:slug, hp:'', iniciado_em:INICIO, variante:'v2', oferta:OFERTA, id_submissao:idSubmissao(), respostas:respostas(), tracking:tracking()})})
    .then(function(r){ return r.json(); });
}
// Se o worker publicado não conhecer o v2 (deploy de outra máquina sem essa config), reenvia no slug
// antigo: a resposta cai no caminho de resgate, que grava nome e telefone e avisa a gente.
function gravar(){
  return post('trafego-pago-v2').then(function(d){
    if(d && d.erro==='formulario_desconhecido') return post('trafego-pago');
    return d;
  }).then(function(d){
    // Envio de teste (header X-Aruna-Teste no worker) volta com teste:true e não conta como Lead.
    if(d && d.ok && d.ref && !d.teste && window.fbq){
      if(d.tel){ try{ fbq('init',PIXEL,{ph:d.tel,fn:(d.nome||'').toLowerCase()}); }catch(e){} }
      fbq('track','Lead',{content_name:'trafego-pago-v2'},{eventID:'form-lead-'+d.ref});
    }
    return d || {};
  }).catch(function(){ return {erro:'rede'}; });
}

ir('inicio');
</script>
